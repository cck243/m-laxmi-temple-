<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Jay Maa Laxmi Temple</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50">
  <!-- Admin Login -->
  <section id="admin-login" class="min-h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-xl shadow-lg w-full max-w-md">
      <h2 class="text-2xl font-bold mb-4">Admin Login</h2>
      <form id="admin-login-form" class="space-y-4">
        <input type="text" id="username" placeholder="Username"
          class="w-full border px-3 py-2 rounded-lg" required>
        <input type="password" id="password" placeholder="Password"
          class="w-full border px-3 py-2 rounded-lg" required>
        <button type="submit" class="w-full bg-orange-500 text-white py-2 rounded-lg">Login</button>
      </form>
      <div class="mt-4 text-sm text-gray-600">
        Demo: <b>admin</b> / <b>jaymaalaxmi2024</b>
      </div>
    </div>
  </section>

  <!-- Admin Dashboard -->
  <section id="admin-dashboard" class="hidden p-6">
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-xl font-bold">Admin Dashboard</h2>
      <div>
        <button id="open-settings" class="bg-blue-500 text-white px-4 py-2 rounded-lg">Settings</button>
        <button id="admin-logout" class="bg-gray-500 text-white px-4 py-2 rounded-lg ml-2">Logout</button>
      </div>
    </div>

    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
      <div class="p-4 bg-white shadow rounded-lg text-center">
        <p class="text-gray-600">Total Donations</p>
        <p id="admin-total" class="text-2xl font-bold">₹0</p>
      </div>
      <div class="p-4 bg-white shadow rounded-lg text-center">
        <p class="text-gray-600">Total Donors</p>
        <p id="admin-count" class="text-2xl font-bold">0</p>
      </div>
      <div class="p-4 bg-white shadow rounded-lg text-center">
        <p class="text-gray-600">Target</p>
        <p id="admin-target" class="text-2xl font-bold">₹0</p>
      </div>
      <div class="p-4 bg-white shadow rounded-lg text-center">
        <p class="text-gray-600">Progress</p>
        <p id="admin-progress-percentage" class="text-2xl font-bold">0%</p>
      </div>
    </div>

    <div class="flex justify-between items-center mb-3">
      <h3 class="font-semibold">Donation Management</h3>
      <button id="open-add-modal" class="bg-green-500 text-white px-4 py-2 rounded-lg">+ Add Donation</button>
    </div>
    <div class="bg-white p-4 rounded-lg shadow overflow-x-auto">
      <table class="w-full text-sm border">
        <thead>
          <tr class="bg-gray-100">
            <th class="p-2 text-left">Date</th>
            <th class="p-2 text-left">Name</th>
            <th class="p-2 text-left">Phone</th>
            <th class="p-2 text-left">Vehicle</th>
            <th class="p-2 text-left">Amount</th>
            <th class="p-2 text-left">Status</th>
            <th class="p-2 text-left">Action</th>
          </tr>
        </thead>
        <tbody id="admin-donation-list"></tbody>
      </table>
    </div>
  </section>

  <!-- Add Donation Modal -->
  <div id="add-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
    <div class="bg-white p-6 rounded-lg w-full max-w-md">
      <h3 class="text-lg font-bold mb-3">Add Donation</h3>
      <form id="add-donation-form" class="space-y-3">
        <input type="text" name="name" placeholder="Name" class="w-full border px-3 py-2 rounded" required>
        <input type="text" name="phone" placeholder="Phone" class="w-full border px-3 py-2 rounded" required>
        <input type="text" name="vehicle" placeholder="Vehicle Number" class="w-full border px-3 py-2 rounded" required>
        <input type="number" name="amount" placeholder="Amount" class="w-full border px-3 py-2 rounded" required>
        <div class="flex justify-end gap-2">
          <button type="button" onclick="closeModal('add-modal')" class="px-4 py-2 border rounded">Cancel</button>
          <button type="submit" class="px-4 py-2 bg-green-500 text-white rounded">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Edit Donation Modal -->
  <div id="edit-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
    <div class="bg-white p-6 rounded-lg w-full max-w-md">
      <h3 class="text-lg font-bold mb-3">Edit Donation</h3>
      <form id="edit-donation-form" class="space-y-3">
        <input type="hidden" name="id">
        <input type="text" name="name" placeholder="Name" class="w-full border px-3 py-2 rounded" required>
        <input type="text" name="phone" placeholder="Phone" class="w-full border px-3 py-2 rounded" required>
        <input type="text" name="vehicle" placeholder="Vehicle Number" class="w-full border px-3 py-2 rounded" required>
        <input type="number" name="amount" placeholder="Amount" class="w-full border px-3 py-2 rounded" required>
        <div class="flex justify-end gap-2">
          <button type="button" onclick="closeModal('edit-modal')" class="px-4 py-2 border rounded">Cancel</button>
          <button type="submit" class="px-4 py-2 bg-blue-500 text-white rounded">Update</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Settings Modal -->
  <div id="settings-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center">
    <div class="bg-white p-6 rounded-lg w-full max-w-md">
      <h3 class="text-lg font-bold mb-3">Settings</h3>
      <form id="settings-form" class="space-y-3">
        <input type="number" name="targetAmount" placeholder="Target Amount" class="w-full border px-3 py-2 rounded" required>
        <input type="text" name="bankAccount" placeholder="Bank Account" class="w-full border px-3 py-2 rounded" required>
        <input type="text" name="ifscCode" placeholder="IFSC Code" class="w-full border px-3 py-2 rounded" required>
        <input type="text" name="upiId" placeholder="UPI ID" class="w-full border px-3 py-2 rounded" required>
        <div class="flex justify-end gap-2">
          <button type="button" onclick="closeModal('settings-modal')" class="px-4 py-2 border rounded">Cancel</button>
          <button type="submit" class="px-4 py-2 bg-orange-500 text-white rounded">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const templeApp = {
      adminLoggedIn: false,
      donations: [],
      settings: {
        targetAmount: 500000,
        bankAccount: "1234567890",
        ifscCode: "SBIN0001234",
        upiId: "jaymaalaxmi@upi"
      },
      showDashboard() {
        document.getElementById("admin-login").classList.add("hidden");
        document.getElementById("admin-dashboard").classList.remove("hidden");
        this.updateStats();
        renderDonations();
      },
      logout() {
        this.adminLoggedIn = false;
        document.getElementById("admin-login").classList.remove("hidden");
        document.getElementById("admin-dashboard").classList.add("hidden");
      },
      addDonation(d) {
        // Duplicate check
        const duplicate = this.donations.find(x =>
          x.name.toLowerCase() === d.name.toLowerCase() &&
          x.vehicle.toLowerCase() === d.vehicle.toLowerCase()
        );
        if (duplicate) {
          alert("⚠️ Duplicate Entry: This donor (Name + Vehicle) already exists!");
          return false;
        }
        this.donations.push({ ...d, id: Date.now(), date: new Date(), verified: true });
        this.updateStats();
        renderDonations();
        return true;
      },
      editDonation(id, data) {
        // Duplicate check (ignore same id)
        const duplicate = this.donations.find(x =>
          x.id !== id &&
          x.name.toLowerCase() === data.name.toLowerCase() &&
          x.vehicle.toLowerCase() === data.vehicle.toLowerCase()
        );
        if (duplicate) {
          alert("⚠️ Duplicate Entry: This donor (Name + Vehicle) already exists!");
          return false;
        }
        const i = this.donations.findIndex(d => d.id === id);
        if (i > -1) {
          this.donations[i] = { ...this.donations[i], ...data };
          this.updateStats();
          renderDonations();
        }
        return true;
      },
      deleteDonation(id) {
        this.donations = this.donations.filter(d => d.id !== id);
        this.updateStats();
        renderDonations();
      },
      updateStats() {
        const total = this.donations.reduce((s, d) => s + Number(d.amount), 0);
        document.getElementById("admin-total").textContent = "₹" + total.toLocaleString();
        document.getElementById("admin-count").textContent = this.donations.length;
        document.getElementById("admin-target").textContent = "₹" + this.settings.targetAmount.toLocaleString();
        const progress = ((total / this.settings.targetAmount) * 100).toFixed(1);
        document.getElementById("admin-progress-percentage").textContent = progress + "%";
      },
      formatDate(d) {
        return new Date(d).toLocaleDateString();
      }
    };

    function renderDonations() {
      const tbody = document.getElementById("admin-donation-list");
      tbody.innerHTML = "";
      templeApp.donations.forEach(d => {
        tbody.innerHTML += `
          <tr class="border-t">
            <td class="p-2">${templeApp.formatDate(d.date)}</td>
            <td class="p-2">${d.name}</td>
            <td class="p-2">${d.phone}</td>
            <td class="p-2">${d.vehicle}</td>
            <td class="p-2">₹${d.amount}</td>
            <td class="p-2">${d.verified ? "✅ Verified" : "⏳ Pending"}</td>
            <td class="p-2">
              <button onclick="openEditModal(${d.id})" class="text-blue-500">Edit</button>
              <button onclick="templeApp.deleteDonation(${d.id})" class="text-red-500 ml-2">Delete</button>
            </td>
          </tr>`;
      });
    }

    function openModal(id) { document.getElementById(id).classList.remove("hidden"); }
    function closeModal(id) { document.getElementById(id).classList.add("hidden"); }

    // Add Donation
    document.getElementById("open-add-modal").onclick = () => openModal("add-modal");
    document.getElementById("add-donation-form").onsubmit = e => {
      e.preventDefault();
      const f = e.target;
      const success = templeApp.addDonation({
        name: f.name.value, phone: f.phone.value, vehicle: f.vehicle.value, amount: Number(f.amount.value)
      });
      if (success) { f.reset(); closeModal("add-modal"); }
    };

    // Edit Donation
    function openEditModal(id) {
      const d = templeApp.donations.find(x => x.id === id);
      const f = document.getElementById("edit-donation-form");
      f.id.value = d.id; f.name.value = d.name; f.phone.value = d.phone;
      f.vehicle.value = d.vehicle; f.amount.value = d.amount;
      openModal("edit-modal");
    }
    document.getElementById("edit-donation-form").onsubmit = e => {
      e.preventDefault();
      const f = e.target;
      const success = templeApp.editDonation(Number(f.id.value), {
        name: f.name.value, phone: f.phone.value, vehicle: f.vehicle.value, amount: Number(f.amount.value)
      });
      if (success) closeModal("edit-modal");
    };

    // Settings
    document.getElementById("open-settings").onclick = () => {
      const f = document.getElementById("settings-form");
      f.targetAmount.value = templeApp.settings.targetAmount;
      f.bankAccount.value = templeApp.settings.bankAccount;
      f.ifscCode.value = templeApp.settings.ifscCode;
      f.upiId.value = templeApp.settings.upiId;
      openModal("settings-modal");
    };
    document.getElementById("settings-form").onsubmit = e => {
      e.preventDefault();
      const f = e.target;
      templeApp.settings.targetAmount = Number(f.targetAmount.value);
      templeApp.settings.bankAccount = f.bankAccount.value;
      templeApp.settings.ifscCode = f.ifscCode.value;
      templeApp.settings.upiId = f.upiId.value;
      templeApp.updateStats();
      closeModal("settings-modal");
    };

    // Login / Logout
    document.getElementById("admin-login-form").onsubmit = e => {
      e.preventDefault();
      if (username.value === "admin" && password.value === "jaymaalaxmi2024") {
        templeApp.adminLoggedIn = true; templeApp.showDashboard();
      } else alert("Invalid credentials");
    };
    document.getElementById("admin-logout").onclick = () => templeApp.logout();

    // Demo data
    templeApp.addDonation({ name: "Ramesh", phone: "9876543210", vehicle: "OD02AB1234", amount: 1000 });
    templeApp.addDonation({ name: "Sita", phone: "9123456780", vehicle: "OD05XY5678", amount: 5000 });
  </script>
</body>
</html>
